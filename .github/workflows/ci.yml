name: CivicConnect CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Match your target framework

    - name: Restore Dependencies
      run: dotnet restore CivicConnect/CivicConnect.csproj

    - name: Build Project
      run: dotnet build CivicConnect/CivicConnect.csproj --configuration Release --no-restore

    - name: Run Tests (if test project exists)
      run: dotnet test --configuration Release --no-build --verbosity normal || true