name: CivicConnect Continuous Integration

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      using: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore CivicConnect.sln

    - name: Build Application
      run: dotnet build CivicConnect.sln --configuration Release --no-restore

    - name: Execute Automated Test Suite (xUnit)
      run: dotnet test CivicConnect.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Publish Test Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xunit-test-results
        path: "**/TestResults/*.trx"